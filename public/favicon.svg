<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Bauhaus Solid Offset Shadow -->
  <path d="M 33 8 L 57 18 V 38 C 57 50 45 58 33 62 C 21 58 9 50 9 38 V 18 Z" fill="#121212" />

  <!-- Shield Clip Definition -->
  <defs>
    <clipPath id="bauhausShieldClip">
      <path d="M 30 4 L 54 14 V 34 C 54 46 42 54 30 58 C 18 54 6 46 6 34 V 14 Z" />
    </clipPath>
  </defs>

  <!-- Segmented Bauhaus Color Blocks -->
  <g clip-path="url(#bauhausShieldClip)">
    <!-- Top-Left: Bauhaus Red -->
    <rect x="0" y="0" width="30" height="34" fill="#D02020" />
    <!-- Top-Right: Bauhaus Blue -->
    <rect x="30" y="0" width="34" height="34" fill="#1040C0" />
    <!-- Bottom: Bauhaus Yellow -->
    <rect x="0" y="34" width="64" height="30" fill="#F0C020" />

    <!-- Internal Division Grid Lines -->
    <line x1="6" y1="34" x2="54" y2="34" stroke="#121212" stroke-width="3" />
    <line x1="30" y1="4" x2="30" y2="34" stroke="#121212" stroke-width="3" />
  </g>

  <!-- Central Bauhaus Constructivist Verification Medallion -->
  <circle cx="30" cy="34" r="13" fill="#121212" stroke="#FFFFFF" stroke-width="2" />
  <!-- Sharp Geometric Checkmark -->
  <path d="M 23 34 L 28 39 L 38 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />

  <!-- Outer Bauhaus Shield Stark Border -->
  <path d="M 30 4 L 54 14 V 34 C 54 46 42 54 30 58 C 18 54 6 46 6 34 V 14 Z" fill="none" stroke="#121212" stroke-width="3.5" />
</svg>