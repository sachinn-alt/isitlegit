<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IsItLegit — Redirecting...</title>
    <script>
      // Single Page Application routing for GitHub Pages
      // Redirects non-root requests to the HashRouter SPA route
      (function () {
        var path = window.location.pathname;
        var repo = '/isitlegit';
        if (path.indexOf(repo) === 0) {
          path = path.slice(repo.length);
        }
        if (!path || path === '/') {
          path = '';
        }
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var newUrl = repo + '/#' + path + search + hash;
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body style="background-color: #F0F0F0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="font-weight: bold; text-transform: uppercase;">Redirecting to IsItLegit Console...</p>
  </body>
</html>
